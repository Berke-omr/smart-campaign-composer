# Used by `make test`. A separate compose project (scc-test) with no published
# ports, so it never touches or clashes with the running dev stack.

name: scc-test

services:
  postgres-test:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    # Throwaway data in RAM; durability settings off because nothing here must survive.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 1s
      timeout: 3s
      retries: 30

  backend-test:
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgres://test:test@postgres-test:5432/test?sslmode=disable
      # Integration tests fail (instead of skipping) if the database is missing.
      REQUIRE_DB_TESTS: "1"
    depends_on:
      postgres-test:
        condition: service_healthy

  frontend-test:
    build:
      context: ./frontend
      target: test
