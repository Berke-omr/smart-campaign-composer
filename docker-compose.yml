# One-command setup: `docker compose up` (no .env needed; every variable has a default).
#
# Startup order:
#   postgres (healthy) -> migrate (exits 0) -> seed (exits 0) -> api (healthy) -> frontend
#                         migrate (exits 0) -> worker
#   mock-provider starts independently.

name: smart-campaign-composer

x-backend: &backend
  build:
    context: ./backend
    target: runtime
  image: smart-campaign-composer/backend:local

x-backend-env: &backend-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://scc:scc@postgres:5432/scc?sslmode=disable

x-http-healthcheck: &http-healthcheck
  test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 5s

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: scc
      POSTGRES_PASSWORD: scc # local-only demo credentials
      POSTGRES_DB: scc
    # Bound to localhost on an uncommon port so it never clashes with a local Postgres.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scc -d scc"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    command: ["/app/migrate"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *backend
    command: ["/app/seed"]
    environment:
      <<: *backend-env
      SEED_USERS: ${SEED_USERS:-5000}
      SEED_RANDOM_SEED: ${SEED_RANDOM_SEED:-42}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *backend
    command: ["/app/api"]
    environment:
      <<: *backend-env
      HTTP_ADDR: ":8080"
      # Empty values fall back to the api's defaults: LLM_PROVIDER=auto (Claude when
      # a key is set, the mock LLM otherwise) and LLM_MODEL=claude-sonnet-5-5.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "${API_HOST_PORT:-8081}:8080"
    healthcheck: *http-healthcheck
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["/app/worker"]
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  mock-provider:
    <<: *backend
    command: ["/app/mockprovider"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      # Faults (DECISIONS.md D24, K5). Empty values use the provider's defaults:
      # 20-120 ms latency, 3% 503, 3% 429, 0.5% slow accepts (10 s),
      # 1% rejected recipients, 100 requests per channel per second.
      MOCK_LATENCY_MIN: ${MOCK_LATENCY_MIN:-}
      MOCK_LATENCY_MAX: ${MOCK_LATENCY_MAX:-}
      MOCK_ERROR_RATE: ${MOCK_ERROR_RATE:-}
      MOCK_THROTTLE_RATE: ${MOCK_THROTTLE_RATE:-}
      MOCK_SLOW_RATE: ${MOCK_SLOW_RATE:-}
      MOCK_SLOW_DELAY: ${MOCK_SLOW_DELAY:-}
      MOCK_REJECT_RATE: ${MOCK_REJECT_RATE:-}
      MOCK_RATE_LIMIT: ${MOCK_RATE_LIMIT:-}
    # Only published for debugging; the worker reaches it on the compose network.
    ports:
      - "127.0.0.1:${MOCK_PROVIDER_HOST_PORT:-18090}:8080"
    healthcheck: *http-healthcheck
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
    image: smart-campaign-composer/frontend:local
    ports:
      - "${UI_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
