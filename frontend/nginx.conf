server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # No version in the Server header or on error pages.
    server_tokens off;
    include /etc/nginx/security-headers.inc;

    # API calls go to the Go api service on the compose network.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Server-Sent Events (live drafts, delivery dashboard) must reach the
        # browser as they are written, not when nginx's buffer fills up.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Hashed assets never change; index.html is revalidated (location / below).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # This add_header hides the server-level ones, so include them again.
        include /etc/nginx/security-headers.inc;
    }

    # Single-page app: unknown paths serve index.html and the router takes over.
    # no-cache makes browsers revalidate index.html every time; without it they
    # may reuse a heuristically cached copy, with the headers it was served with.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.inc;
    }
}
