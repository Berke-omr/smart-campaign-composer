server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API calls go to the Go api service on the compose network.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Server-Sent Events (live drafts, delivery dashboard) must reach the
        # browser as they are written, not when nginx's buffer fills up.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Hashed assets never change; everything else (index.html) is revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths serve index.html and the router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
